<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linux Drill Lab — 20 operator scenarios (RH124 / RH134 scope)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202A;
  --ink-2:#41505C;
  --paper:#F1F2ED;
  --panel:#FFFFFF;
  --rule:#C8CDC6;
  --pine:#2E6B54;
  --ochre:#8A6A12;
  --signal:#2C4B8F;
  --term:#1B2731;
  --term-fg:#DCE3E7;
  --radius:3px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.55;
}
code,kbd,pre,.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:var(--signal)}
h1,h2,h3,h4{line-height:1.2;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

header.top{border-bottom:2px solid var(--ink);background:var(--paper);position:sticky;top:0;z-index:20}
.topgrid{display:flex;align-items:baseline;gap:24px;flex-wrap:wrap;padding:14px 0 10px}
.topgrid h1{font-size:20px;font-weight:600;letter-spacing:-0.01em}
.topgrid .sub{color:var(--ink-2);font-size:14px}
.meter{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.bar{width:170px;height:8px;background:#D8DCD6;border:1px solid var(--rule);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--pine);width:0%}
nav.tabs{display:flex;gap:0;border-top:1px solid var(--rule)}
nav.tabs button{
  appearance:none;background:none;border:0;border-bottom:3px solid transparent;
  padding:9px 14px;font:inherit;font-size:14px;color:var(--ink-2);cursor:pointer;
}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
nav.tabs button:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}

main{padding:26px 0 90px}
.layout{display:grid;grid-template-columns:280px 1fr;gap:34px;align-items:start}
aside{position:sticky;top:104px;max-height:calc(100vh - 130px);overflow:auto;border-right:1px solid var(--rule);padding-right:14px}
aside h3{font-size:12px;font-weight:600;color:var(--ink-2);margin:14px 0 6px}
aside ol{list-style:none;margin:0;padding:0}
aside li a{
  display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;
  padding:5px 6px;text-decoration:none;color:var(--ink);font-size:13.5px;border-radius:var(--radius);
}
aside li a:hover{background:#E3E6E0}
aside li a .n{color:var(--ink-2);font-size:12px}
aside li a.done{color:var(--pine)}
.pct{font-size:11px;color:var(--ink-2)}

.sc{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--ink);margin-bottom:28px;padding:20px 22px 6px}
.sc.level-Hard{border-left-color:var(--ochre)}
.sc.level-Capstone{border-left-color:var(--pine)}
.sc > h2{font-size:21px;font-weight:600;letter-spacing:-0.01em}
.role{color:var(--ink-2);font-size:14px;margin:3px 0 12px}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:7px 0;margin-bottom:14px}
.facts b{font-weight:600;color:var(--ink)}
.brief{font-size:15.5px;max-width:76ch;margin:0 0 14px}
h4.sec{font-size:13px;font-weight:600;margin:18px 0 7px;color:var(--ink)}
pre.term{background:var(--term);color:var(--term-fg);padding:11px 13px;border-radius:var(--radius);overflow:auto;font-size:13px;line-height:1.5;margin:0 0 10px;white-space:pre-wrap;word-break:break-word}
pre.term .c{color:#9BB3A6}

ol.tasks{list-style:none;counter-reset:t;margin:0;padding:0}
ol.tasks > li{counter-increment:t;border-top:1px solid var(--rule);padding:12px 0 12px 0;display:grid;grid-template-columns:26px 1fr;gap:10px}
ol.tasks > li:first-child{border-top:2px solid var(--ink)}
ol.tasks input[type=checkbox]{width:17px;height:17px;margin-top:3px;accent-color:var(--pine)}
.tbody .q{font-size:15px;max-width:80ch}
.tbody .q:before{content:counter(t) ". ";color:var(--ink-2);font-family:"IBM Plex Mono",monospace;font-size:13px}
.tbody.done .q{color:var(--ink-2)}
details{margin-top:8px}
details > summary{
  cursor:pointer;display:inline-block;font-size:12.5px;color:var(--ochre);
  border:1px solid var(--ochre);border-radius:var(--radius);padding:2px 9px;margin-right:6px;
  list-style:none;
}
details > summary::-webkit-details-marker{display:none}
details[open] > summary{background:var(--ochre);color:#fff}
details.sol > summary{border-color:var(--ink);color:var(--ink)}
details.sol[open] > summary{background:var(--ink);color:#fff}
details > div{margin-top:8px}
.hintbox{font-size:14px;border-left:2px solid var(--rule);padding-left:10px;color:var(--ink-2);max-width:78ch}
.check{font-size:13px;color:var(--pine);margin-top:2px}
.check b{font-weight:600}

table.distro{border-collapse:collapse;width:100%;font-size:13.5px;margin-bottom:8px}
table.distro th,table.distro td{border-bottom:1px solid var(--rule);text-align:left;padding:6px 10px 6px 0;vertical-align:top}
table.distro th{width:130px;font-weight:600;white-space:nowrap}
.practice{font-size:14px;background:#E9EEE9;border-left:3px solid var(--pine);padding:9px 12px;max-width:82ch}
ul.docs{margin:6px 0 16px;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
ul.docs li{margin:2px 0}

.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.day{background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--ink);padding:14px}
.day h3{font-size:15px;margin-bottom:2px}
.day p{font-size:13px;color:var(--ink-2);margin:2px 0 8px}
.day ul{margin:0;padding-left:16px;font-size:13.5px}
.idx{column-count:2;column-gap:30px;font-size:13.5px}
.idx dt{font-weight:600;font-family:"IBM Plex Mono",monospace;font-size:13px;margin-top:9px}
.idx dd{margin:0 0 2px 0;color:var(--ink-2)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 22px}
.tools button{font:inherit;font-size:13px;padding:5px 11px;background:var(--panel);border:1px solid var(--ink);border-radius:var(--radius);cursor:pointer}
.tools button:hover{background:var(--ink);color:#fff}
.note{font-size:14px;max-width:80ch;color:var(--ink-2)}
[hidden]{display:none !important}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule);padding-bottom:10px}
  .idx{column-count:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="topgrid">
      <h1>Linux Drill Lab</h1>
      <span class="sub">20 operator scenarios · RH124 + RH134 scope · RHEL 10 primary, RHEL 9 / Fedora / Ubuntu deltas</span>
      <div class="meter"><span id="pcttext">0 of 0 steps</span><span class="bar"><i id="pctbar"></i></span></div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-scenarios" aria-selected="true" data-view="scenarios">Scenarios</button>
      <button role="tab" id="tab-plan" aria-selected="false" data-view="plan">5-day plan</button>
      <button role="tab" id="tab-index" aria-selected="false" data-view="index">Command index</button>
      <button role="tab" id="tab-lab" aria-selected="false" data-view="lab">Lab setup</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <section id="view-scenarios">
    <div class="layout">
      <aside><h3>Scenarios</h3><ol id="toc"></ol>
        <div class="tools" style="margin-top:14px">
          <button id="exportBtn">Export progress</button>
          <button id="resetBtn">Reset all</button>
        </div>
      </aside>
      <div id="scenarios"></div>
    </div>
  </section>
  <section id="view-plan" hidden></section>
  <section id="view-index" hidden></section>
  <section id="view-lab" hidden></section>
</main>
<script>
const SCENARIOS = [
{
  id:"s01", level:"Warm-up", mins:45, map:"RH124 ch1-5, ch16",
  title:"Take over an undocumented server",
  role:"You joined the platform team. A host was handed over with no runbook. Before anyone touches it, produce a baseline fact sheet.",
  brief:"Everything an operator does later depends on knowing the machine. This drill is about extracting facts non-destructively, redirecting them into a report, and finding answers from the machine itself instead of a search engine.",
  setup:["# nothing to break - run this on any VM","sudo -v"],
  tasks:[
    {q:"Create /var/tmp/baseline as a working directory that only you can enter, and make every file you create inside it default to rw for you and r for your group.",
     hint:"Directory needs 0700. The default for new files is controlled by umask in this shell, not by chmod on the directory.",
     sol:["install -d -m 0700 /var/tmp/baseline","cd /var/tmp/baseline","umask 0137   # new files -> 0640, new dirs -> 0640&0777","umask         # confirm"],
     check:"stat -c '%a %U' /var/tmp/baseline  ->  700 <you>"},
    {q:"Write a single report file recording: OS release and version, kernel, architecture, hostname, boot time, timezone and whether NTP is synchronised.",
     hint:"hostnamectl and timedatectl each print several of these in one shot. Use a here-document or append with >> to build one file.",
     sol:["{ echo '== identity =='; hostnamectl","  echo; echo '== time =='; timedatectl","  echo; echo '== kernel =='; uname -a","  echo; echo '== release =='; cat /etc/os-release","  echo; echo '== uptime =='; uptime -p; uptime -s","} > 01-identity.txt","less 01-identity.txt"],
     check:"grep -c . 01-identity.txt returns a non-zero count"},
    {q:"Record CPU, memory, block devices with filesystem type and UUID, and mounted filesystem usage in human units.",
     hint:"lsblk has an -f mode that prints FSTYPE, UUID and MOUNTPOINT together. df needs -T to print the type.",
     sol:["{ lscpu | head -n 20","  echo; free -h","  echo; lsblk -f","  echo; df -hT -x tmpfs -x devtmpfs","  echo; swapon --show","} > 02-hardware.txt"],
     check:"grep -E 'xfs|ext4|btrfs' 02-hardware.txt"},
    {q:"Record the network picture: interface names and addresses in one-line form, the default route, DNS resolvers in effect, and every listening TCP/UDP socket with the owning process.",
     hint:"ip has a -br (brief) output mode. Socket listing needs root to show process names.",
     sol:["{ ip -br addr; echo; ip route show","  echo; resolvectl status 2>/dev/null || cat /etc/resolv.conf","  echo; sudo ss -tulpn","} > 03-network.txt"],
     check:"ss -tulpn | grep -q ':22' on any box with sshd running"},
    {q:"Record service state: everything enabled at boot, everything currently failed, and the five units that took longest to start.",
     hint:"systemd-analyze blame sorts unit start times. Filter enabled units with the --state flag of list-unit-files.",
     sol:["{ systemctl list-unit-files --state=enabled --no-pager","  echo; systemctl --failed --no-pager","  echo; systemd-analyze blame | head -n 5","  echo; systemd-analyze critical-chain","} > 04-services.txt"],
     check:"systemctl --failed shows 0 loaded units listed on a healthy box"},
    {q:"Without opening a browser, find out which manual page documents the file format of /etc/fstab, and extract only the section that lists mount options.",
     hint:"Search the manual database by keyword; section 5 is file formats. man can be piped.",
     sol:["man -k fstab            # or: apropos fstab","man 5 fstab | sed -n '/The fourth field/,/The fifth field/p'","# if man -k returns nothing:","sudo mandb"],
     check:"You can state what field 4 and field 6 of /etc/fstab control"},
    {q:"Package the whole report directory into a timestamped compressed archive in /var/tmp, owned by you, then verify the archive contents without extracting it.",
     hint:"Use command substitution with date +%F for the name. tar can list an archive with -t.",
     sol:["cd /var/tmp","tar -czf baseline-$(hostname -s)-$(date +%F).tar.gz baseline/","tar -tzvf baseline-$(hostname -s)-$(date +%F).tar.gz","ls -lh baseline-*.tar.gz"],
     check:"tar -tzf ... lists 4 txt files"}
  ],
  distro:[
    ["RHEL 10","hostnamectl, timedatectl and lsblk -f behave as shown. /etc/os-release is the only supported release file; there is no lsb_release by default."],
    ["RHEL 9","Identical. Difference appears later, in networking and firewall drills, not here."],
    ["Fedora 42","Same tools. systemd-analyze output is usually much shorter because the desktop spawns fewer system units than a server profile."],
    ["Ubuntu 24.04","ss, ip, lsblk, systemd-analyze identical. DNS is resolved by systemd-resolved so /etc/resolv.conf is a symlink to a stub - always read resolvectl status instead."]
  ],
  practice:"Every incident review starts with 'what was the state of the box'. Teams that run a baseline capture on handover (and store it in git) resolve incidents far faster than teams that reconstruct facts under pressure. This is what tools like sos report automate - run sudo sos report on RHEL once to see the same idea at industrial scale.",
  docs:["Red Hat: Configuring basic system settings (RHEL 10) - Configuring system locale, keyboard, time","man 5 os-release, man 1 hostnamectl, man 8 ss, man 1 systemd-analyze","man 5 fstab, man 1 tar"]
},
{
  id:"s02", level:"Core", mins:60, map:"RH124 ch3, ch13, ch15",
  title:"Reclaim a release directory that grew out of control",
  role:"A build server has filled its data volume. An application team dumped releases, logs and backups into one tree with inconsistent ownership. Nothing may be deleted without an inventory.",
  brief:"This is the classic disk-full page. It drills path handling, find with real predicates, hard links versus symlinks, safe deletion of filenames containing spaces, and archive extraction that preserves ownership.",
  setup:["sudo install -d -m 0755 /srv/releases","cd /srv/releases","sudo mkdir -p app-{1.0,1.1,1.2}/{bin,conf,logs} archive shared","sudo bash -c 'for v in 1.0 1.1 1.2; do head -c 20M </dev/urandom > app-$v/app.jar; done'","sudo bash -c 'for v in 1.0 1.1 1.2; do for i in 1 2 3; do head -c 3M </dev/urandom > app-$v/logs/app-$i.log; done; done'","sudo touch -d '400 days ago' app-1.0/app.jar app-1.0/logs/*","sudo bash -c 'touch \"/srv/releases/shared/old report (final).txt\"'","sudo chown -R nobody:nobody app-1.0"],
  tasks:[
    {q:"Report disk usage for /srv/releases: total size of the tree, then the size of each immediate subdirectory, largest first.",
     hint:"du summarises; -s stops at one level, --max-depth=1 gives you each child. Sorting needs machine-readable sizes.",
     sol:["df -hT /srv","sudo du -sh /srv/releases","sudo du -h --max-depth=1 /srv/releases | sort -hr"],
     check:"You can name the largest subdirectory in one line of output"},
    {q:"List the ten largest regular files anywhere under the tree, with size and owner, without following symlinks.",
     hint:"find -type f then delegate formatting to -printf, or pipe null-separated names into du. Sorting by human sizes needs sort -h.",
     sol:["sudo find /srv/releases -type f -printf '%s %u %p\\n' | sort -nr | head -10","# human readable variant:","sudo find /srv/releases -type f -printf '%k KiB %u %p\\n' | sort -nr | head -10"],
     check:"Output includes the three app.jar files"},
    {q:"Find every file not modified in the last 180 days AND larger than 10 MiB, and write the list to /var/tmp/stale.txt using a null-safe format.",
     hint:"-mtime works in days, -size accepts M suffix. Null-separated output is -print0; write both a readable list and a machine list.",
     sol:["sudo find /srv/releases -type f -mtime +180 -size +10M -printf '%TY-%Tm-%Td %10s %p\\n' | tee /var/tmp/stale.txt","sudo find /srv/releases -type f -mtime +180 -size +10M -print0 > /var/tmp/stale.nul"],
     check:"grep -c . /var/tmp/stale.txt is at least 1 and lists only app-1.0 content"},
    {q:"Archive everything on that stale list into /srv/releases/archive/stale-<date>.tar.gz, preserving ownership and permissions, then confirm the archive is readable before any deletion happens.",
     hint:"tar can read a null-separated file list. Ownership preservation on extraction requires root and the right flag.",
     sol:["sudo tar --null -czf /srv/releases/archive/stale-$(date +%F).tar.gz --files-from=/var/tmp/stale.nul","sudo tar -tzvf /srv/releases/archive/stale-$(date +%F).tar.gz | head","# integrity test:","sudo gzip -t /srv/releases/archive/stale-$(date +%F).tar.gz && echo ARCHIVE OK"],
     check:"gzip -t exits 0 and the listing shows the app-1.0 paths"},
    {q:"Delete the archived files - safely. The list may contain names with spaces and parentheses.",
     hint:"Never pipe plain filenames into rm. Either use the null list with xargs -0, or let find run the deletion itself.",
     sol:["xargs -0 -a /var/tmp/stale.nul sudo rm -f --","# equivalent, single pass:","sudo find /srv/releases -type f -mtime +180 -size +10M -delete","sudo du -sh /srv/releases"],
     check:"find ... -mtime +180 -size +10M now prints nothing"},
    {q:"The current release must be reachable at a stable path /srv/releases/current that points at app-1.2, and conf/app.conf must appear inside both app-1.1 and app-1.2 as the same inode so that editing one edits the other.",
     hint:"One of these is a symbolic link (crosses directories, can dangle). The other is a hard link (same inode, same filesystem only). Prove the inode with ls -i.",
     sol:["sudo bash -c 'echo mode=prod > /srv/releases/app-1.2/conf/app.conf'","sudo ln -sfn /srv/releases/app-1.2 /srv/releases/current","sudo ln /srv/releases/app-1.2/conf/app.conf /srv/releases/app-1.1/conf/app.conf","ls -li /srv/releases/app-1.*/conf/app.conf","ls -l /srv/releases/current","stat -c '%h links, inode %i' /srv/releases/app-1.2/conf/app.conf"],
     check:"Both conf files show the same inode number and a link count of 2"},
    {q:"Copy the whole tree to /srv/backup preserving permissions, ownership, timestamps, symlinks and ACLs - and prove that a second run copies nothing.",
     hint:"cp -a or rsync -a; the extended attribute and ACL flags are separate. Idempotency is what you are proving.",
     sol:["sudo rsync -aAX --info=stats2 /srv/releases/ /srv/backup/","sudo rsync -aAX --info=stats2 /srv/releases/ /srv/backup/   # second run: 0 transferred","sudo diff -r --no-dereference /srv/releases /srv/backup && echo IDENTICAL"],
     check:"The second rsync reports 0 files transferred"}
  ],
  distro:[
    ["RHEL 10","XFS is the default filesystem. XFS cannot be shrunk, only grown - that constraint shapes every capacity decision you make later in the LVM drill."],
    ["RHEL 9","Same. RHEL 10 removed support for the old XFS v4 on-disk format, so a filesystem created on RHEL 7 or earlier may refuse to mount on RHEL 10."],
    ["Fedora 42","Default filesystem is Btrfs on Workstation, so df and du can disagree with each other because of compression and subvolumes. Check with findmnt -t btrfs."],
    ["Ubuntu 24.04","ext4 by default; find, du, rsync identical. rsync -X (xattrs) needs the filesystem mounted with user_xattr, which is the default on ext4."]
  ],
  practice:"Archive before delete, list before archive, and never build a deletion pipeline out of newline-separated filenames. The find -print0 / xargs -0 pair exists precisely because one filename with a space has destroyed production more than once.",
  docs:["Red Hat: Managing file systems (RHEL 10)","man 1 find (see PRINTF FORMAT and the -delete caveats), man 1 xargs, man 1 tar, man 1 rsync"]
},
{
  id:"s03", level:"Core", mins:55, map:"RH124 ch6",
  title:"Onboard a team under an audit policy",
  role:"An auditor requires: named accounts for three engineers, a shared group, a locked service account, password ageing, and sudo rights that are provable from a file rather than from memory.",
  brief:"Account management is the most frequently examined and most frequently botched area, because the defaults live in three different files and the sudo syntax is unforgiving.",
  setup:["sudo -v","# no pre-seed required - you create everything"],
  tasks:[
    {q:"Create the group appops with GID 6000, and a system group appsvc with no fixed GID.",
     hint:"System groups come from a lower GID range controlled by /etc/login.defs.",
     sol:["sudo groupadd -g 6000 appops","sudo groupadd -r appsvc","getent group appops appsvc"],
     check:"getent group appops shows x:6000"},
    {q:"Create users nadia, tharindu and ravi with home directories, bash as login shell, and membership of appops as a supplementary group - without disturbing their primary groups.",
     hint:"-G adds supplementary groups; -g would replace the primary group. -m forces home creation on systems where it is not the default.",
     sol:["for u in nadia tharindu ravi; do","  sudo useradd -m -s /bin/bash -G appops \"$u\"","done","id nadia","getent passwd nadia tharindu ravi"],
     check:"id nadia lists gid=<own group> and groups=...,6000(appops)"},
    {q:"Set an initial password for each of them that must be changed at first login.",
     hint:"You can pipe a password in with --stdin on RHEL, but the expiry is a separate ageing command that sets last-change to zero.",
     sol:["for u in nadia tharindu ravi; do","  echo \"Onboard#2026\" | sudo passwd --stdin \"$u\"","  sudo chage -d 0 \"$u\"","done","sudo chage -l nadia"],
     check:"chage -l nadia shows 'Last password change : password must be changed'"},
    {q:"Enforce the audit policy on all three: maximum age 90 days, minimum age 1 day, warn 7 days before expiry, and disable the account 14 days after the password expires.",
     hint:"One command does all four. The inactivity window is -I, not -E.",
     sol:["for u in nadia tharindu ravi; do","  sudo chage -M 90 -m 1 -W 7 -I 14 \"$u\"","done","sudo chage -l ravi"],
     check:"chage -l ravi shows Maximum 90, Minimum 1, Warning 7, Inactive 14"},
    {q:"Make those ageing values the default for every future account created on this host.",
     hint:"Defaults for useradd live in two places: the ageing values in /etc/login.defs and the skeleton/shell defaults in /etc/default/useradd.",
     sol:["sudo grep -E '^(PASS_MAX_DAYS|PASS_MIN_DAYS|PASS_WARN_AGE|UID_MIN|GID_MIN)' /etc/login.defs","sudo sed -i 's/^PASS_MAX_DAYS.*/PASS_MAX_DAYS   90/; s/^PASS_MIN_DAYS.*/PASS_MIN_DAYS   1/; s/^PASS_WARN_AGE.*/PASS_WARN_AGE   7/' /etc/login.defs","sudo useradd -D              # shows /etc/default/useradd contents","sudo useradd -D -f 14        # default INACTIVE"],
     check:"useradd -D shows INACTIVE=14; a newly created test user inherits 90/1/7"},
    {q:"Create the service account appsvc: no home directory, no interactive login, locked password, primary group appsvc.",
     hint:"A service account needs a shell that refuses login and a password field that cannot match anything. Two different flags, both required.",
     sol:["sudo useradd -r -g appsvc -s /sbin/nologin -M -d /var/lib/appsvc appsvc","sudo passwd -l appsvc","sudo getent passwd appsvc","sudo passwd -S appsvc          # expect: LK"],
     check:"passwd -S appsvc prints LK (locked) and the shell is /sbin/nologin"},
    {q:"Grant appops members the right to run only systemctl restart/status on the unit httpd, and nothing else, as root without a password prompt. The rule must survive a package upgrade of sudo.",
     hint:"Never edit /etc/sudoers directly, and never append there for local policy - drop a file in the include directory and validate it before it takes effect.",
     sol:["sudo bash -c 'cat > /etc/sudoers.d/appops << SUDO","Cmnd_Alias APPSVC = /usr/bin/systemctl restart httpd, /usr/bin/systemctl status httpd","%appops ALL=(root) NOPASSWD: APPSVC","SUDO'","sudo chmod 0440 /etc/sudoers.d/appops","sudo visudo -cf /etc/sudoers.d/appops","sudo -l -U nadia"],
     check:"visudo -cf reports 'parsed OK' and sudo -l -U nadia lists only the two commands"},
    {q:"Prove the policy works: show that nadia can restart httpd but cannot read /etc/shadow, and that appsvc cannot log in at all.",
     hint:"su - runs a login shell as another user. Expect one success and two refusals.",
     sol:["sudo -u nadia sudo -n systemctl status httpd ; echo rc=$?","sudo -u nadia sudo -n cat /etc/shadow ; echo rc=$?   # must fail","sudo su - appsvc ; echo rc=$?                        # must refuse: nologin"],
     check:"The shadow read is refused with 'a password is required' or 'not allowed'"}
  ],
  distro:[
    ["RHEL 10","wheel is the default administrative group. passwd --stdin exists. /etc/sudoers includes /etc/sudoers.d by default."],
    ["RHEL 9","Identical for this drill."],
    ["Fedora 42","Identical to RHEL. Newly installed Fedora also adds the first user to wheel automatically."],
    ["Ubuntu 24.04","The admin group is sudo, not wheel. passwd has no --stdin - use chpasswd instead: echo 'user:pass' | sudo chpasswd. adduser is a Perl wrapper with different defaults from useradd; in scripts always call useradd for portability."]
  ],
  practice:"Sudo rights expressed as a package-managed drop-in file are auditable; rights granted by adding someone to wheel are not. Real teams keep /etc/sudoers.d under configuration management and run visudo -c in CI.",
  docs:["Red Hat: Configuring basic system settings (RHEL 10) - Managing user and group accounts","man 5 login.defs, man 1 chage, man 8 useradd, man 5 sudoers, man 8 visudo"]
},
{
  id:"s04", level:"Hard", mins:60, map:"RH124 ch7, RH134 ACL section",
  title:"Build a shared workspace that enforces its own rules",
  role:"Two teams share one directory on a file server. Files created by anyone must stay group-readable by appops, nobody may delete another persons files, and one external auditor needs read-only access without joining the group.",
  brief:"Permissions questions are rarely 'what is 755'. They are 'make the directory behave a certain way for everyone who will ever write into it' - which means setgid, the sticky bit, umask, and ACLs including default ACLs.",
  setup:["sudo groupadd -f appops","sudo useradd -m nadia 2>/dev/null; sudo useradd -m ravi 2>/dev/null; sudo useradd -m auditor 2>/dev/null","sudo usermod -aG appops nadia; sudo usermod -aG appops ravi","sudo install -d /srv/shared"],
  tasks:[
    {q:"Make /srv/shared owned by root:appops, writable by the group, and traversable but invisible in content to everyone else.",
     hint:"Others need no read and no execute here. Work out the numeric mode before typing it.",
     sol:["sudo chown root:appops /srv/shared","sudo chmod 2770 /srv/shared      # 2 = setgid, 770 = rwx for owner+group","stat -c '%A %U:%G' /srv/shared"],
     check:"stat shows drwxrws--- root:appops"},
    {q:"Guarantee that any file created inside inherits the group appops regardless of who creates it. Prove it with two different users.",
     hint:"That is exactly what the s in the group field of the previous step does. Now demonstrate it.",
     sol:["sudo -u nadia touch /srv/shared/from-nadia","sudo -u ravi  touch /srv/shared/from-ravi","ls -l /srv/shared"],
     check:"Both files show group appops even though each users primary group differs"},
    {q:"Stop users deleting each others files in that directory, while keeping the directory group-writable.",
     hint:"This is the /tmp behaviour. It is a third special bit, and it lands on the directory, not the files.",
     sol:["sudo chmod +t /srv/shared","stat -c '%A %a' /srv/shared      # drwxrws--T  3770","sudo -u ravi rm /srv/shared/from-nadia ; echo rc=$?   # must fail"],
     check:"The delete attempt fails with 'Operation not permitted' and the mode reads 3770"},
    {q:"Files created by team members currently end up 0644. Make new files default to 0660 and new directories to 0770 for members of appops - persistently, for login shells.",
     hint:"umask subtracts from 0666 for files and 0777 for directories. Persist it in a drop-in under /etc/profile.d, applied only to members of the group.",
     sol:["sudo tee /etc/profile.d/appops-umask.sh > /dev/null << 'EOS'","if id -nG | grep -qw appops; then","    umask 0007","fi","EOS","sudo chmod 0644 /etc/profile.d/appops-umask.sh","sudo su - nadia -c 'umask; touch /srv/shared/umask-test; ls -l /srv/shared/umask-test'"],
     check:"umask prints 0007 for nadia and the new file is -rw-rw----"},
    {q:"Give the user auditor read and execute on the directory and read on everything already in it, without adding auditor to appops and without changing the directory mode.",
     hint:"This is what POSIX ACLs are for. Recursive application needs one flag; capital X applies execute only where it already exists.",
     sol:["sudo setfacl -R -m u:auditor:rX /srv/shared","getfacl /srv/shared","ls -ld /srv/shared            # note the trailing + on the mode"],
     check:"ls -ld shows a + and getfacl lists user:auditor:r-x"},
    {q:"Make that auditor access apply automatically to every file and directory created in future.",
     hint:"An ACL entry can be marked as a default entry, inherited by new children. It does not affect existing files.",
     sol:["sudo setfacl -m d:u:auditor:rX /srv/shared","sudo -u nadia touch /srv/shared/new-after-default","getfacl /srv/shared/new-after-default"],
     check:"The new file shows user:auditor:r-- inherited, without you touching it"},
    {q:"Check the effective permission auditor actually gets, explain the mask line, then temporarily reduce the auditor to read-only-on-directory by tightening the mask, and finally remove the auditor entries entirely.",
     hint:"The mask is the ceiling for all named users and groups. getfacl prints an #effective comment when the mask clips an entry.",
     sol:["getfacl /srv/shared","sudo setfacl -m m::r /srv/shared      # mask = r only","getfacl /srv/shared                    # note #effective:r--","sudo setfacl -x u:auditor /srv/shared","sudo setfacl -b -R /srv/shared         # remove all ACLs recursively","ls -ld /srv/shared                     # the + is gone"],
     check:"After -b the + disappears from ls -ld and getfacl shows only the three base entries"},
    {q:"Find every file anywhere under /srv that is world-writable or has the setuid bit set, and report it.",
     hint:"find can match on permission bits with -perm; the slash prefix means 'any of these bits'.",
     sol:["sudo find /srv -xdev -type f -perm -0002 -printf '%M %u %p\\n'","sudo find / -xdev -type f -perm /6000 -printf '%M %u %p\\n' 2>/dev/null | head"],
     check:"You can explain why /usr/bin/passwd appears in the setuid list"}
  ],
  distro:[
    ["RHEL 10","XFS supports ACLs unconditionally. SELinux runs enforcing, so a file may carry correct permissions and still be refused - that is scenario 18, not a permissions bug."],
    ["RHEL 9","Identical."],
    ["Fedora 42","Identical; Btrfs also supports ACLs by default."],
    ["Ubuntu 24.04","ext4 mounts with ACL support on by default since kernel 2.6.39-era defaults, but on an exotic mount check with: findmnt -no OPTIONS /srv. AppArmor replaces SELinux; nothing in this drill changes."]
  ],
  practice:"2770 plus the sticky bit is the standard shared-project directory in every enterprise file server build sheet. ACLs are the correct answer when someone needs access that does not justify a group - reach for them before you invent a group named after one person.",
  docs:["Red Hat: Managing file systems (RHEL 10) - Managing file permissions and access control lists","man 1 setfacl, man 1 getfacl, man 5 acl, man 2 umask, man 1 find"]
},
{
  id:"s05", level:"Core", mins:50, map:"RH124 ch8, RH134 ch3",
  title:"A process is eating the box at 02:00",
  role:"You are on call. Monitoring reports load average above 30 on an application node. SSH still works, barely. Find it, contain it, keep the evidence.",
  brief:"Process control is judged on whether you can name the offender, stop it in the right order (TERM before KILL), keep the service running, and prove what happened afterwards.",
  setup:["# create the load (3 spinners + one memory hog); run each in its own shell or with &","for i in 1 2 3; do ( while :; do :; done ) & done","sleep 1; jobs"],
  tasks:[
    {q:"Identify the top five CPU consumers with PID, user, %CPU, %MEM, start time and full command line - as a single sorted snapshot, not an interactive screen.",
     hint:"ps takes a sort key. Interactive top is fine for looking; a snapshot is what you paste into the incident channel.",
     sol:["ps -eo pid,ppid,user,pcpu,pmem,lstart,etime,comm --sort=-pcpu | head -n 6","# wide command line:","ps auxww --sort=-pcpu | head -n 6"],
     check:"The bash spinner loops appear at the top with ~100% CPU each"},
    {q:"Confirm the load and identify whether the box is CPU-bound, memory-bound or IO-bound.",
     hint:"Load average alone cannot tell you. Compare run-queue against memory pressure and IO wait - uptime, free, and the wa column.",
     sol:["uptime","free -h; cat /proc/pressure/cpu /proc/pressure/io /proc/pressure/memory","vmstat 1 5","top -b -n 1 | head -n 12"],
     check:"You can state which of us/sy/wa dominates in the top summary line"},
    {q:"Show the process tree so you can see which parent spawned the offenders, and show only processes owned by your user.",
     hint:"ps has a forest mode; pstree renders the same relationship. -u filters by effective user.",
     sol:["ps -ef --forest | head -40","pstree -pu $USER","ps -u $USER -o pid,ppid,stat,comm"],
     check:"The spinners share a parent shell PID"},
    {q:"Stop one offender politely, verify it is gone, and only then force-kill the remaining ones. Explain in one line why the order matters.",
     hint:"Default signal is 15 (TERM), the one a process can trap and clean up with. 9 (KILL) cannot be trapped and leaves temp files and locks behind.",
     sol:["kill -l | head","PID=$(pgrep -n -u $USER bash)","kill -TERM \"$PID\"; sleep 2; ps -p \"$PID\" || echo gone","pkill -9 -u $USER -f 'while :'","jobs; ps -u $USER -o pid,pcpu,comm --sort=-pcpu | head"],
     check:"No bash spinner remains and load average starts falling"},
    {q:"Restart a long-running job so it survives your SSH session closing, keep its output, and confirm it is detached from the terminal.",
     hint:"Three ways: nohup, disown after backgrounding, or systemd-run as a transient unit. Show at least two.",
     sol:["nohup sleep 600 > /var/tmp/job.log 2>&1 &","disown -h %1","ps -o pid,ppid,tty,stat,comm -p $!","# the systemd way, which survives logout cleanly and gets a journal:","systemd-run --user --unit=drill-sleep /bin/sleep 600","systemctl --user status drill-sleep"],
     check:"ps shows TTY as ? for the nohup job"},
    {q:"Lower the scheduling priority of a CPU-heavy job so interactive work stays responsive, both at launch and after the fact.",
     hint:"nice sets it at start (range -20 to 19, only root can go negative), renice changes a running one.",
     sol:["nice -n 19 bash -c 'while :; do :; done' &","ps -o pid,ni,pcpu,comm -p $!","sudo renice -n 5 -p $!","sudo renice -n -5 -u nadia        # by user","ps -o pid,ni,comm -p $!"],
     check:"The NI column reads 19, then 5"},
    {q:"Find which process is holding a given file or port open, and terminate it by matching its command line rather than by PID.",
     hint:"lsof and fuser answer the file question; ss -p answers the port question; pkill -f matches the full command line.",
     sol:["sudo ss -tulpn | grep ':22'","sudo lsof -i :22 | head","sudo lsof /var/log/messages 2>/dev/null | head","sudo fuser -v /var/log/messages","pgrep -a -f 'sleep 600'","pkill -f 'sleep 600'"],
     check:"pgrep -a -f 'sleep 600' returns nothing afterwards"},
    {q:"Write the incident evidence to a file: the offending command lines, their cumulative CPU time, and when they started.",
     hint:"etime is elapsed, time is CPU consumed. Capture before you kill, in a real incident.",
     sol:["ps -eo pid,user,lstart,etime,time,pcpu,args --sort=-time | head -n 15 | sudo tee /var/tmp/incident-$(date +%F-%H%M).txt","journalctl --since '10 min ago' -p warning --no-pager | tail -30"],
     check:"The evidence file exists and includes a START column"}
  ],
  distro:[
    ["RHEL 10","cgroups v2 only - cgroups v1 was removed. systemd-cgtop and systemctl status <unit> show per-unit CPU and memory accounting; use them before ps when the offender is a service."],
    ["RHEL 9","cgroups v2 by default but v1 could still be booted. Otherwise identical."],
    ["Fedora 42","Identical to RHEL 10."],
    ["Ubuntu 24.04","Same tools. lsof and pstree may not be installed: sudo apt install lsof psmisc. Ubuntu ships with earlyoom on desktop images, which may kill the memory hog for you."]
  ],
  practice:"TERM, wait, then KILL is the industry rule, and it is also what systemd does for you (TimeoutStopSec then SIGKILL). If you find yourself typing kill -9 first, you are destroying the evidence you will be asked for in the postmortem.",
  docs:["Red Hat: Monitoring and managing system status and performance (RHEL 10)","man 1 ps (STANDARD FORMAT SPECIFIERS), man 1 pgrep, man 7 signal, man 1 nice, man 8 lsof, man 1 systemd-run"]
},
{
  id:"s06", level:"Core", mins:55, map:"RH124 ch10, ch13",
  title:"Harden the jump host every engineer logs through",
  role:"Security flagged the bastion: password logins are enabled, root can log in directly, and nobody knows which keys are trusted. You have a maintenance window of one hour and you must not lock yourself out.",
  brief:"SSH is where most people discover that editing a config is the easy part and validating it before reload is the part that saves your job. Keep a second session open for every step of this drill.",
  setup:["sudo systemctl status sshd --no-pager | head -5","# open a SECOND terminal to the same host now and keep it open"],
  tasks:[
    {q:"Generate a modern key pair for yourself with a comment identifying the host and the date, then show its fingerprint.",
     hint:"Ed25519 is the current default recommendation; RSA must be at least 3072 bits if you must use it. -C sets the comment.",
     sol:["ssh-keygen -t ed25519 -a 64 -C \"$USER@$(hostname -s)-$(date +%F)\" -f ~/.ssh/id_ed25519","ssh-keygen -lf ~/.ssh/id_ed25519.pub","# RSA fallback only if a legacy device requires it:","ssh-keygen -t rsa -b 4096 -C legacy-only -f ~/.ssh/id_rsa_legacy"],
     check:"ssh-keygen -lf prints 256 SHA256:... (ED25519)"},
    {q:"Install that public key for a target user so key-based login works, then verify the permissions SSH requires on the home directory, .ssh and authorized_keys.",
     hint:"ssh-copy-id does it for you, but you must be able to do it by hand too: the directory is 700 and the file 600, owned by the user.",
     sol:["ssh-copy-id -i ~/.ssh/id_ed25519.pub nadia@localhost","# manual equivalent:","sudo install -d -m 0700 -o nadia -g nadia /home/nadia/.ssh","sudo cp ~/.ssh/id_ed25519.pub /home/nadia/.ssh/authorized_keys","sudo chown nadia:nadia /home/nadia/.ssh/authorized_keys","sudo chmod 0600 /home/nadia/.ssh/authorized_keys","ssh -o PasswordAuthentication=no nadia@localhost 'id; exit'"],
     check:"The test login succeeds without a password prompt"},
    {q:"Disable password authentication and direct root login, and restrict SSH to members of the group appops - using a drop-in file, not by editing the main config.",
     hint:"sshd_config reads /etc/ssh/sshd_config.d/*.conf, and for most keywords the FIRST value wins, so the drop-in must be included before the defaults. Check the Include line at the top of the main file.",
     sol:["head -n 5 /etc/ssh/sshd_config      # confirm the Include line","sudo tee /etc/ssh/sshd_config.d/50-hardening.conf > /dev/null << 'EOS'","PermitRootLogin no","PasswordAuthentication no","KbdInteractiveAuthentication no","PubkeyAuthentication yes","AllowGroups appops","MaxAuthTries 3","LoginGraceTime 30","EOS","sudo chmod 0600 /etc/ssh/sshd_config.d/50-hardening.conf"],
     check:"The file exists with mode 600 under sshd_config.d"},
    {q:"Validate the configuration BEFORE applying it, then apply it without dropping existing sessions.",
     hint:"sshd has a test mode and an extended test mode that prints the effective config. reload re-reads config; restart drops the daemon.",
     sol:["sudo sshd -t && echo SYNTAX OK","sudo sshd -T | grep -Ei 'permitrootlogin|passwordauth|allowgroups|maxauthtries'","sudo systemctl reload sshd","sudo systemctl status sshd --no-pager | head -5"],
     check:"sshd -T reports permitrootlogin no and passwordauthentication no"},
    {q:"Prove the policy from the client side: password login is refused, key login works, root is refused, and a user outside appops is refused.",
     hint:"Force a single auth method from the client to prove the server is enforcing, not the client choosing.",
     sol:["ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no nadia@localhost ; echo rc=$?","ssh nadia@localhost 'echo key login OK'","ssh root@localhost ; echo rc=$?","sudo gpasswd -d nadia appops && ssh nadia@localhost ; echo rc=$?","sudo gpasswd -a nadia appops"],
     check:"Only the key login succeeds; the others fail with Permission denied"},
    {q:"Configure your client so that reaching the private node db01 through the bastion is a single command, with the key, user and jump host remembered.",
     hint:"~/.ssh/config with a Host block, and the ProxyJump keyword. File permissions matter here too.",
     sol:["cat >> ~/.ssh/config << 'EOS'","Host bastion","    HostName 10.0.0.10","    User nadia","    IdentityFile ~/.ssh/id_ed25519","","Host db01","    HostName 10.10.0.21","    User nadia","    ProxyJump bastion","EOS","chmod 0600 ~/.ssh/config","ssh -G db01 | grep -E 'proxyjump|identityfile|user '"],
     check:"ssh -G db01 shows the proxyjump and identity file resolved"},
    {q:"Copy a 100 MB artefact to the remote host over SSH in a way that can resume if the link drops, and compare it with a plain copy.",
     hint:"scp is a single-shot copy; rsync over ssh can resume and can limit bandwidth.",
     sol:["head -c 100M </dev/urandom > /var/tmp/artifact.bin","scp /var/tmp/artifact.bin nadia@localhost:/var/tmp/","rsync -avP --partial --bwlimit=10M -e ssh /var/tmp/artifact.bin nadia@localhost:/var/tmp/","sftp nadia@localhost <<< 'ls /var/tmp'"],
     check:"The rsync run reports the file as up to date on a second invocation"},
    {q:"Show every SSH authentication event from the last hour, and identify any failed attempts and their source.",
     hint:"sshd logs to the journal on RHEL; the unit filter plus a time window is enough.",
     sol:["sudo journalctl -u sshd --since '1 hour ago' --no-pager | tail -40","sudo journalctl -u sshd --since today | grep -Ei 'failed|invalid|accepted'","sudo lastb | head        # bad logins, from /var/log/btmp","last -n 10               # good logins, from /var/log/wtmp"],
     check:"You can point at one Accepted publickey line and read the fingerprint from it"}
  ],
  distro:[
    ["RHEL 10","Host key permissions were tightened back to 0600 and the ssh_keys group was removed. The DEFAULT crypto policy no longer accepts TLS RSA key exchange and the LEGACY policy no longer allows SHA-1 signatures in TLS - so an old client may fail to negotiate. Check with: update-crypto-policies --show."],
    ["RHEL 9","Host keys are 0640 owned by group ssh_keys. update-crypto-policies --set DEFAULT:SHA1 still exists here; it was removed in RHEL 10."],
    ["Fedora 42","Same as RHEL 10, including system-wide crypto policies."],
    ["Ubuntu 24.04","No crypto policies framework - cipher and MAC lists are set directly in sshd_config. The service unit is called ssh (with an alias sshd), so use systemctl reload ssh. Ubuntu 24.04 splits the socket activation into ssh.socket; if reload does nothing, check systemctl status ssh.socket."]
  ],
  practice:"Two rules that survive every audit: never test a config change by restarting the only daemon you are connected through without a second session open, and always run the daemons own validator (sshd -t, nginx -t, named-checkconf) before reload. sshd -T is the one that settles arguments, because it prints what the daemon actually resolved.",
  docs:["Red Hat: Configuring basic system settings (RHEL 10) - Using secure communications between two systems with OpenSSH","man 5 sshd_config (note the Include and 'first obtained value' rules), man 5 ssh_config, man 1 ssh-keygen"]
},
{
  id:"s07", level:"Hard", mins:60, map:"RH124 ch9, ch14",
  title:"A service will not start after a config change",
  role:"Someone changed a web server config and rebooted. The unit is failed, the team is asking for an ETA, and the change is not in git.",
  brief:"This drill teaches the systemd diagnostic loop that applies to every unit you will ever debug: status, journal, cat, edit, daemon-reload, verify - plus overrides and masking, which are where most people lose marks and time.",
  setup:["sudo dnf install -y httpd  # RHEL/Fedora   |   sudo apt install -y apache2  # Ubuntu","sudo systemctl enable --now httpd","echo 'Listen 80' | sudo tee /etc/httpd/conf.d/zz-broken.conf","echo 'ServerRoot /does/not/exist' | sudo tee -a /etc/httpd/conf.d/zz-broken.conf","sudo systemctl restart httpd  # expect failure"],
  tasks:[
    {q:"Read the failure properly: the unit state, the exit code, and the last log lines - in one command.",
     hint:"systemctl status already tails the journal; -l stops truncation.",
     sol:["systemctl status httpd -l --no-pager","systemctl is-active httpd; systemctl is-enabled httpd; systemctl is-failed httpd","systemctl show httpd -p ExecMainStatus -p Result -p ActiveState"],
     check:"You can quote the exit status and the Result= value"},
    {q:"Pull only this units log for the current boot, at priority warning or worse, with full message detail.",
     hint:"-u filters by unit, -b by boot, -p by priority, -o verbose prints all journal fields.",
     sol:["sudo journalctl -u httpd -b -p warning --no-pager","sudo journalctl -u httpd -b -o verbose --no-pager | tail -40","sudo journalctl -xeu httpd --no-pager | tail -30"],
     check:"You can name the offending directive from the log alone"},
    {q:"Confirm the diagnosis with the applications own config test, without starting the service.",
     hint:"Apache ships a syntax checker. Every serious daemon has one.",
     sol:["sudo httpd -t                 # RHEL/Fedora","sudo apachectl configtest      # portable alias","sudo apache2ctl configtest     # Ubuntu"],
     check:"The test names the file and line number"},
    {q:"Fix the config, restart, and confirm the service is both running and listening.",
     hint:"Remove the bad directive; then check the socket, not just the unit state - a unit can be active and still not listening.",
     sol:["sudo rm -f /etc/httpd/conf.d/zz-broken.conf","sudo httpd -t && sudo systemctl restart httpd","systemctl is-active httpd","sudo ss -tlnp | grep ':80'","curl -sI http://localhost | head -1"],
     check:"curl returns HTTP/1.1 200 (or 403 with an empty docroot, which still proves it is listening)"},
    {q:"Show the shipped unit file and every drop-in currently applied to it, and say where each file lives.",
     hint:"One command prints the full merged picture with file path headers.",
     sol:["systemctl cat httpd","systemctl show httpd -p FragmentPath -p DropInPaths","ls -l /usr/lib/systemd/system/httpd.service /etc/systemd/system/httpd.service.d/ 2>/dev/null"],
     check:"You can state the difference between /usr/lib/systemd/system and /etc/systemd/system"},
    {q:"Make the service restart automatically on failure, wait 10 seconds between attempts, and give it a 90 second start timeout - without editing the vendor unit file.",
     hint:"systemctl edit creates an override drop-in. The plain form creates a partial override; --full copies the whole unit.",
     sol:["sudo systemctl edit httpd","# in the editor, between the marker comments:","# [Service]","# Restart=on-failure","# RestartSec=10","# TimeoutStartSec=90","sudo systemctl daemon-reload","systemctl show httpd -p Restart -p RestartSec -p TimeoutStartUSec","systemctl cat httpd | tail -20"],
     check:"systemctl show prints Restart=on-failure and RestartSec=10s"},
    {q:"Prove the override works: kill the main process and watch systemd bring it back, reading the evidence from the journal.",
     hint:"Kill the MainPID. Then follow the journal for the unit.",
     sol:["MP=$(systemctl show -p MainPID --value httpd)","sudo kill -9 \"$MP\"","sleep 12; systemctl status httpd --no-pager | head -6","sudo journalctl -u httpd --since '2 min ago' --no-pager | tail -15"],
     check:"The journal shows 'Scheduled restart job' and the unit is active again with a new MainPID"},
    {q:"Prevent the service from ever being started - even as a dependency of another unit - then reverse it.",
     hint:"disable only removes the boot symlink. The stronger form links the unit to /dev/null.",
     sol:["sudo systemctl mask httpd","sudo systemctl start httpd ; echo rc=$?     # refused","systemctl status httpd --no-pager | head -3","ls -l /etc/systemd/system/httpd.service","sudo systemctl unmask httpd","sudo systemctl enable --now httpd"],
     check:"While masked, the unit file path is a symlink to /dev/null and start is refused"},
    {q:"Map the boot: what the default target is, which units this service wants and is wanted by, and how to reach a state with no graphical stack.",
     hint:"list-dependencies goes both ways with --reverse. Targets replace SysV runlevels.",
     sol:["systemctl get-default","systemctl list-dependencies httpd | head -20","systemctl list-dependencies --reverse httpd","systemctl list-units --type=target","sudo systemctl isolate multi-user.target   # careful on a desktop"],
     check:"You can state the target httpd is wanted by (multi-user.target)"}
  ],
  distro:[
    ["RHEL 10","httpd.service now ships with hardening directives applied by default, including ProtectHome=read-only, so a docroot under /home will fail even with correct permissions. Read /usr/lib/systemd/system/httpd.service before blaming SELinux."],
    ["RHEL 9","No such default hardening on httpd; a /home docroot fails for SELinux reasons only."],
    ["Fedora 42","Same as RHEL 10."],
    ["Ubuntu 24.04","Package is apache2, config lives in /etc/apache2 with sites-available and sites-enabled, and the validator is apache2ctl configtest. systemctl edit, cat, mask and drop-ins are identical - systemd is the portable part."]
  ],
  practice:"Never edit a vendor unit file in /usr/lib/systemd/system: the next package update overwrites it silently. systemctl edit writes to /etc/systemd/system/<unit>.d/override.conf, which survives updates and shows up in systemctl cat - which is what the next engineer will run.",
  docs:["Red Hat: Configuring basic system settings (RHEL 10) - Managing systemd services","man 1 systemctl, man 5 systemd.service, man 5 systemd.unit, man 5 systemd.exec"]
},
{
  id:"s08", level:"Core", mins:55, map:"RH124 ch11",
  title:"Reconstruct an incident from logs alone",
  role:"A node rebooted unexpectedly at 03:40 last night. The application team says 'the OS killed us'. You have to establish what actually happened, and make sure the next occurrence leaves evidence behind.",
  brief:"Journald is volatile by default on a fresh install - the most common reason an incident cannot be reconstructed is that the previous boot was never persisted. This drill covers reading, filtering, persisting, sizing and forwarding logs, plus time correctness, without which correlation is impossible.",
  setup:["logger -p local7.warning 'DRILL: synthetic warning event'","logger -t drillapp -p user.err 'DRILL: application error 500 from 10.0.0.5'","sudo systemctl restart chronyd 2>/dev/null || sudo systemctl restart systemd-timesyncd"],
  tasks:[
    {q:"Establish whether the journal survives reboots on this host, and if not, make it persistent - then confirm where it now lives.",
     hint:"Storage is set in journald.conf; persistence is really just the existence of /var/log/journal. The service must be restarted or signalled to pick it up.",
     sol:["sudo journalctl --list-boots | head","grep -E '^#?Storage' /etc/systemd/journald.conf","sudo mkdir -p /var/log/journal","sudo sed -i 's/^#\\?Storage=.*/Storage=persistent/' /etc/systemd/journald.conf","sudo systemd-tmpfiles --create --prefix /var/log/journal","sudo systemctl restart systemd-journald","journalctl --list-boots"],
     check:"journalctl --list-boots lists more than one boot after a reboot"},
    {q:"Show everything that happened between 03:30 and 04:00 last night, at priority err or worse.",
     hint:"--since and --until accept 'YYYY-MM-DD HH:MM:SS' and relative forms like 'yesterday'. Priority accepts a name or a range.",
     sol:["sudo journalctl --since '2026-09-12 03:30' --until '2026-09-12 04:00' -p err --no-pager","sudo journalctl --since yesterday --until today -p 0..3 --no-pager | tail -40","sudo journalctl -b -1 -p err --no-pager   # previous boot"],
     check:"You can produce an empty or populated result and explain which boot you queried"},
    {q:"Answer the 'did the kernel kill it' question: show kernel messages only, and search for out-of-memory killer activity across all stored boots.",
     hint:"-k is kernel only; --grep applies a regex to the message field; -b -1 is the previous boot.",
     sol:["sudo journalctl -k -b -1 --no-pager | tail -50","sudo journalctl --grep='Out of memory|oom-kill|Killed process' --no-pager","sudo dmesg -T | grep -iE 'oom|killed process'"],
     check:"You can state definitively whether an OOM kill is recorded"},
    {q:"Follow the log live, filtered to one unit and one identifier, and generate a matching event from a second terminal.",
     hint:"-f follows; -t filters by syslog identifier; combine with -u for the unit.",
     sol:["journalctl -f -t drillapp &","logger -t drillapp -p user.err 'DRILL: second event'","sudo journalctl -u sshd -f --no-pager   # ctrl-c to stop"],
     check:"The tailing session prints the new message within a second"},
    {q:"Show the journals disk footprint, cap it at 500 MB permanently, and vacuum anything older than 14 days right now.",
     hint:"SystemMaxUse in journald.conf is the persistent control; --vacuum-* are the immediate ones.",
     sol:["journalctl --disk-usage","sudo sed -i 's/^#\\?SystemMaxUse=.*/SystemMaxUse=500M/' /etc/systemd/journald.conf","sudo systemctl restart systemd-journald","sudo journalctl --vacuum-time=14d","sudo journalctl --vacuum-size=500M"],
     check:"journalctl --disk-usage reports a value under the cap"},
    {q:"Route every message from facility local7 into its own file under /var/log, using the traditional syslog daemon, and prove it works.",
     hint:"rsyslog reads /etc/rsyslog.d/*.conf. A selector is facility.priority followed by the target file. Restart, then generate an event with logger.",
     sol:["sudo tee /etc/rsyslog.d/60-drill.conf > /dev/null << 'EOS'","local7.*    /var/log/drill.log","EOS","sudo systemctl restart rsyslog","logger -p local7.info 'DRILL: rsyslog routing test'","sudo tail -5 /var/log/drill.log"],
     check:"/var/log/drill.log contains the test line"},
    {q:"Make sure that new log file is rotated weekly, kept for four generations, compressed, and created with mode 0640 root:adm - then force a rotation to test the rule without waiting a week.",
     hint:"logrotate config goes in /etc/logrotate.d. Test with -d (dry run) before -f (force).",
     sol:["sudo tee /etc/logrotate.d/drill > /dev/null << 'EOS'","/var/log/drill.log {","    weekly","    rotate 4","    compress","    delaycompress","    missingok","    notifempty","    create 0640 root root","}","EOS","sudo logrotate -d /etc/logrotate.d/drill      # dry run","sudo logrotate -f /etc/logrotate.d/drill      # force","ls -l /var/log/drill.log*"],
     check:"A drill.log.1 (or .1.gz) appears and the live file is recreated"},
    {q:"Verify the clock is correct and synchronised - and explain why this is the first thing to check in any multi-host incident.",
     hint:"timedatectl summarises; the chrony client shows the actual sources and offset.",
     sol:["timedatectl","chronyc sources -v","chronyc tracking","sudo timedatectl set-timezone Asia/Colombo","sudo timedatectl set-ntp true"],
     check:"timedatectl shows 'System clock synchronized: yes' and 'NTP service: active'"}
  ],
  distro:[
    ["RHEL 10","chronyd is the NTP implementation; systemd-timesyncd is not used. rsyslog is still installed and journald is the primary store."],
    ["RHEL 9","Identical behaviour for this drill."],
    ["Fedora 42","Journal is persistent by default on new installs. rsyslog is NOT installed by default - dnf install rsyslog first, or do the whole drill with journald only."],
    ["Ubuntu 24.04","Time sync is systemd-timesyncd (timedatectl set-ntp true, then timedatectl show-timesync --all), not chrony, unless you install chrony. rsyslog IS installed and /var/log/syslog is the catch-all file. logrotate configs default to create 0640 root adm - the adm group is Ubuntu-specific."]
  ],
  practice:"Persistent journal, a size cap, and correct NTP are three lines of configuration that decide whether a postmortem is possible at all. Do them in your base image, not after the incident.",
  docs:["Red Hat: Configuring basic system settings (RHEL 10) - Auditing the system / Reviewing logs","man 1 journalctl, man 5 journald.conf, man 5 rsyslog.conf, man 8 logrotate, man 1 timedatectl, man 1 chronyc"]
},
{
  id:"s09", level:"Hard", mins:60, map:"RH124 ch12",
  title:"Renumber a host onto a new management network",
  role:"The datacentre is being re-addressed. This host must move from DHCP to a static address on a new VLAN, keep a second connection profile for the old network for rollback, and resolve internal names correctly - all over SSH without losing the session.",
  brief:"NetworkManager is the only supported path on RHEL 9 and 10, and the ifcfg files people remember from RHEL 7 no longer exist in RHEL 10. This drill is done entirely with nmcli, plus the verification tools that prove it worked.",
  setup:["nmcli -t -f NAME,DEVICE,TYPE connection show","ip -br addr","# use a SECOND interface or a console/VM window - do not renumber the interface carrying your SSH session"],
  tasks:[
    {q:"List all connection profiles and devices, and identify which profile is currently active on which device, including its method (auto vs manual).",
     hint:"nmcli has terse and field-selected output modes that are better than the pretty default for scripting.",
     sol:["nmcli connection show","nmcli device status","nmcli -f NAME,UUID,TYPE,DEVICE,ACTIVE connection show","nmcli -g ipv4.method,ipv4.addresses connection show \"$(nmcli -t -f NAME connection show --active | head -1)\""],
     check:"You can name the active profile, its UUID and its device"},
    {q:"Create a new profile named mgmt on a spare interface with a static address 192.168.56.40/24, gateway 192.168.56.1, DNS 192.168.56.1 and 1.1.1.1, search domain corp.local - without activating it yet.",
     hint:"con add takes con-name, ifname, type and ip4/gw4 in one go; everything else is a property set with con mod. autoconnect no keeps it dormant.",
     sol:["nmcli connection add type ethernet con-name mgmt ifname enp0s8 \\","  ipv4.method manual ipv4.addresses 192.168.56.40/24 \\","  ipv4.gateway 192.168.56.1 ipv4.dns '192.168.56.1 1.1.1.1' \\","  ipv4.dns-search corp.local ipv6.method disabled \\","  autoconnect no","nmcli connection show mgmt | grep -E 'ipv4.(method|addresses|gateway|dns)'"],
     check:"nmcli connection show mgmt lists ipv4.method: manual with the right address"},
    {q:"Show where NetworkManager stored that profile on disk and read the file.",
     hint:"RHEL 9 and 10 store profiles as keyfiles, not as ifcfg scripts.",
     sol:["ls -l /etc/NetworkManager/system-connections/","sudo cat /etc/NetworkManager/system-connections/mgmt.nmconnection","stat -c '%a %U:%G' /etc/NetworkManager/system-connections/mgmt.nmconnection"],
     check:"The file is a .nmconnection keyfile with mode 600"},
    {q:"Activate the profile, confirm the address, route and DNS actually took effect at the kernel level - not just in NetworkManagers view.",
     hint:"nmcli tells you what it intends; ip and resolvectl tell you what the kernel and resolver actually have.",
     sol:["sudo nmcli connection up mgmt","ip -br addr show enp0s8","ip route show","resolvectl status enp0s8 2>/dev/null || cat /etc/resolv.conf","nmcli device show enp0s8 | grep -E 'IP4.(ADDRESS|GATEWAY|DNS)'"],
     check:"ip -br addr shows 192.168.56.40/24 and ip route shows the new gateway"},
    {q:"Add a second address to the same profile without removing the first, then remove just the second.",
     hint:"nmcli property modification supports += and -= prefixes for list-valued properties.",
     sol:["sudo nmcli connection modify mgmt +ipv4.addresses 192.168.56.41/24","sudo nmcli connection up mgmt","ip -br addr show enp0s8","sudo nmcli connection modify mgmt -ipv4.addresses 192.168.56.41/24","sudo nmcli connection up mgmt"],
     check:"Both addresses appear, then only the first remains"},
    {q:"Set the system hostname permanently, add a local name resolution entry for db01, and verify that resolution order works.",
     hint:"hostnamectl sets the static hostname; /etc/hosts is consulted before DNS according to /etc/nsswitch.conf.",
     sol:["sudo hostnamectl set-hostname bastion01.corp.local","hostnamectl status","echo '192.168.56.50  db01 db01.corp.local' | sudo tee -a /etc/hosts","getent hosts db01","grep ^hosts: /etc/nsswitch.conf"],
     check:"getent hosts db01 returns the static entry"},
    {q:"Run the standard connectivity ladder to prove the path: link, gateway, DNS, then a named host - and interpret a failure at each rung.",
     hint:"Layer by layer: is the link up, can you reach the gateway, does the resolver answer, does the name resolve to something you can reach.",
     sol:["ip -br link","ping -c2 192.168.56.1        # gateway","ping -c2 1.1.1.1              # routing beyond the gateway","dig +short redhat.com         # or: host redhat.com","ping -c2 redhat.com","tracepath -4 redhat.com | head","ss -tunap | head"],
     check:"You can state which rung fails when you unplug DNS (ip works, name does not)"},
    {q:"Roll back: deactivate mgmt, bring the original profile back up, and delete the mgmt profile cleanly.",
     hint:"down, up, delete. Deleting a profile does not remove the address if the profile is still active.",
     sol:["sudo nmcli connection down mgmt","sudo nmcli connection up 'Wired connection 1'","sudo nmcli connection delete mgmt","nmcli connection show","ls /etc/NetworkManager/system-connections/"],
     check:"The keyfile is gone and the original profile is active"}
  ],
  distro:[
    ["RHEL 10","Support for ifcfg-format files was REMOVED. /etc/sysconfig/network-scripts is no longer read. dhclient was also removed; NetworkManager uses its internal DHCP client (dhcp=internal). The team driver (teamd/libteam) is gone - use bonding."],
    ["RHEL 9","Keyfiles are the default for new profiles, but existing ifcfg files still work. dhclient and teamd are present but deprecated. Migrate before upgrading to 10."],
    ["Fedora 42","Keyfile-only, same as RHEL 10. nmcli syntax identical."],
    ["Ubuntu 24.04","Servers use netplan writing YAML in /etc/netplan/*.yaml, rendered to systemd-networkd (server) or NetworkManager (desktop). Workflow: edit YAML, then sudo netplan try (auto-reverts after 120s) then sudo netplan apply. nmcli only works if the renderer is NetworkManager. Verification commands (ip, ss, resolvectl) are identical."]
  ],
  practice:"netplan try and nmcli connection up with a rollback profile exist for the same reason: renumbering a host over its own management link is how engineers lock themselves out. Keep the old profile until the new one is verified, and always have console access before you touch the primary interface.",
  docs:["Red Hat: Configuring and managing networking (RHEL 10)","man 1 nmcli, man 5 nm-settings-nmcli, man 5 NetworkManager.conf, man 8 ip, man 8 ss, man 5 nsswitch.conf"]
},
{
  id:"s10", level:"Hard", mins:60, map:"RH134 ch10",
  title:"Firewall a three-tier application",
  role:"One host runs a web front end (80/443), an application listener on 8080 that only the internal subnet may reach, and SSH that only the management subnet may reach. Everything else is denied. Nothing may break when the host reboots.",
  brief:"firewalld is zone-based, and the single most common mistake is forgetting that runtime and permanent are two separate rule sets. This drill also covers source-based zone assignment, rich rules, port forwarding and masquerading.",
  setup:["sudo dnf install -y firewalld  # RHEL/Fedora","sudo systemctl enable --now firewalld","sudo firewall-cmd --state"],
  tasks:[
    {q:"Report the current firewall posture: default zone, active zones with their interfaces and sources, and everything the default zone currently allows.",
     hint:"--list-all-zones is noisy; --list-all on the active zone is the one you want.",
     sol:["sudo firewall-cmd --state","sudo firewall-cmd --get-default-zone","sudo firewall-cmd --get-active-zones","sudo firewall-cmd --list-all","sudo firewall-cmd --get-services | tr ' ' '\\n' | grep -E '^(http|https|ssh)$'"],
     check:"You can name the default zone and list its allowed services"},
    {q:"Open HTTP and HTTPS permanently in the public zone by service name, and make them effective without a reboot.",
     hint:"Permanent changes do not apply until a reload. Do both, then verify from the permanent set specifically.",
     sol:["sudo firewall-cmd --permanent --zone=public --add-service=http --add-service=https","sudo firewall-cmd --reload","sudo firewall-cmd --zone=public --list-services","sudo firewall-cmd --permanent --zone=public --list-services   # the authoritative check"],
     check:"Both runtime and permanent listings include http and https"},
    {q:"Create an internal zone that accepts traffic from 10.10.0.0/24 only, and allow port 8080/tcp there - not in the default zone.",
     hint:"A zone can be bound to a source network instead of an interface. Sources win over interfaces for matching.",
     sol:["sudo firewall-cmd --permanent --zone=internal --add-source=10.10.0.0/24","sudo firewall-cmd --permanent --zone=internal --add-port=8080/tcp","sudo firewall-cmd --reload","sudo firewall-cmd --zone=internal --list-all","sudo firewall-cmd --get-active-zones"],
     check:"The internal zone lists the source 10.10.0.0/24 and port 8080/tcp"},
    {q:"Restrict SSH so it is reachable only from the management subnet 10.20.0.0/24 and denied everywhere else. Verify you have not locked yourself out first.",
     hint:"A rich rule carries a source and an action. Remove the plain ssh service from the wide-open zone only after the rich rule is proven.",
     sol:["sudo firewall-cmd --permanent --zone=public --add-rich-rule='rule family=ipv4 source address=10.20.0.0/24 service name=ssh accept'","sudo firewall-cmd --reload","sudo firewall-cmd --zone=public --list-rich-rules","# only after confirming your own source address matches:","ip -br addr; who am i","sudo firewall-cmd --permanent --zone=public --remove-service=ssh","sudo firewall-cmd --reload"],
     check:"--list-rich-rules shows the accept rule and ssh is no longer in --list-services"},
    {q:"Rate-limit new SSH connections to five per minute and log dropped attempts with a prefix, using rich rules.",
     hint:"Rich rules support a limit clause and a log clause with prefix and level.",
     sol:["sudo firewall-cmd --permanent --zone=public --add-rich-rule='rule family=ipv4 source address=10.20.0.0/24 service name=ssh log prefix=\"SSH-ACCEPT \" level=info limit value=5/m accept'","sudo firewall-cmd --permanent --zone=public --add-rich-rule='rule family=ipv4 service name=ssh log prefix=\"SSH-DROP \" level=notice limit value=3/m drop'","sudo firewall-cmd --reload","sudo firewall-cmd --list-rich-rules","sudo journalctl -k --grep='SSH-' --no-pager | tail"],
     check:"Both rich rules are listed and kernel log entries appear with your prefix"},
    {q:"Forward inbound port 443 on this host to 8443 on the application host 10.10.0.21, and enable the address translation that makes return traffic work.",
     hint:"Port forwarding between hosts needs masquerade enabled in the zone, and IP forwarding in the kernel.",
     sol:["sudo firewall-cmd --permanent --zone=public --add-masquerade","sudo firewall-cmd --permanent --zone=public --add-forward-port=port=443:proto=tcp:toport=8443:toaddr=10.10.0.21","sudo firewall-cmd --reload","sudo firewall-cmd --zone=public --list-all","sysctl net.ipv4.ip_forward","sudo sysctl -w net.ipv4.ip_forward=1","echo 'net.ipv4.ip_forward = 1' | sudo tee /etc/sysctl.d/99-forward.conf"],
     check:"--list-all shows masquerade: yes and the forward-port entry"},
    {q:"Inspect the nftables ruleset firewalld actually generated, and explain the relationship between the two.",
     hint:"firewalld is a front end; the kernel enforces nftables rules. Reading them is how you resolve arguments about rule order.",
     sol:["sudo nft list ruleset | head -60","sudo nft list table inet firewalld | grep -A5 'chain filter_IN_public_allow'","sudo firewall-cmd --direct --get-all-rules   # legacy escape hatch, avoid in new builds"],
     check:"You can find your port 8080 rule inside the nft output"},
    {q:"Write a panic-mode test and recovery: block all traffic, confirm it is blocked, then restore - and explain why you would never do this over SSH.",
     hint:"firewalld has an explicit panic mode. Run this from a console session only.",
     sol:["sudo firewall-cmd --panic-on","sudo firewall-cmd --query-panic","sudo firewall-cmd --panic-off","# safer alternative for a real lockout risk:","sudo systemd-run --on-active=120 --timer-property=AccuracySec=1s firewall-cmd --panic-off"],
     check:"--query-panic returns yes, then no"}
  ],
  distro:[
    ["RHEL 10","firewalld on nftables. The firewalld lockdown feature was REMOVED in RHEL 10. iptables-nft is deprecated and its kernel modules moved to kernel-modules-extra - build new rules with firewalld or nft only."],
    ["RHEL 9","Same firewalld model; iptables-nft still present but deprecated (loading it logs a 'not recommended for new deployments' warning)."],
    ["Fedora 42","Identical to RHEL 10."],
    ["Ubuntu 24.04","ufw is the default front end over nftables: sudo ufw allow 80/tcp, sudo ufw allow from 10.20.0.0/24 to any port 22 proto tcp, sudo ufw enable, sudo ufw status verbose. Rules are permanent by default - there is no runtime/permanent split. firewalld can be installed, but do not run both."]
  ],
  practice:"Two habits separate people who get paged from people who do not: always end a firewalld change with --reload and re-check with --permanent --list-all, and always add the new allow rule before removing the old one. Source-based zones are how real multi-tier hosts are segmented - one zone per trust boundary, never a pile of rich rules in public.",
  docs:["Red Hat: Securing networks (RHEL 10) - Using and configuring firewalld / Getting started with nftables","man 1 firewall-cmd, man 5 firewalld.richlanguage, man 5 firewalld.zone, man 8 nft"]
},
{
  id:"s11", level:"Core", mins:50, map:"RH124 ch14",
  title:"Run a patching window you can roll back",
  role:"Monthly patch night. You must apply security errata only, know exactly what changed, restart only the services that need it, and be able to undo the whole transaction if the application team calls at 06:00.",
  brief:"Package management is judged on whether you can query before you install, scope an update, and reverse it. dnf history is the feature most people never learn and the one that saves the night.",
  setup:["sudo dnf repolist","sudo dnf clean all && sudo dnf makecache"],
  tasks:[
    {q:"List enabled repositories with their package counts, then show the full configuration of one repository including its GPG settings.",
     hint:"repolist has a verbose mode; the config lives in /etc/yum.repos.d/*.repo.",
     sol:["sudo dnf repolist --enabled","sudo dnf repolist -v | head -40","sudo dnf config-manager --dump 2>/dev/null | head -30","grep -rE '^\\[|gpgcheck|enabled|baseurl|metalink' /etc/yum.repos.d/*.repo | head -30"],
     check:"You can state whether gpgcheck is on for every enabled repo"},
    {q:"Answer three query questions without installing anything: which package provides the command /usr/sbin/semanage, what files a package installs, and which package owns a file already on disk.",
     hint:"dnf provides searches package contents; rpm -ql lists an installed package; rpm -qf maps a path back to its package. Note the RHEL 10 filelists caveat.",
     sol:["sudo dnf provides /usr/sbin/semanage","# RHEL 10: filelists metadata is no longer downloaded by default. If the path query fails:","sudo dnf provides '*/semanage' --setopt=optional_metadata_types=filelists","rpm -qf /usr/bin/ssh","rpm -ql openssh-clients | head","rpm -qi openssh-clients | head -15","dnf repoquery --list openssh-server | head"],
     check:"You can name the package that owns /usr/bin/ssh"},
    {q:"Show what a full update would do without doing it, then apply security errata only.",
     hint:"--assumeno or check-update give you the preview; updateinfo describes errata; --security scopes the transaction.",
     sol:["sudo dnf check-update | head -30","sudo dnf updateinfo list --available | head -20","sudo dnf update --security --assumeno","sudo dnf update --security -y"],
     check:"The transaction summary lists only packages tied to security advisories"},
    {q:"Determine which running services are using deleted libraries and therefore need a restart, and restart exactly those.",
     hint:"dnf ships a plugin for this. The -r form answers with a yes/no exit status suitable for scripts.",
     sol:["sudo dnf install -y dnf-utils   # provides needs-restarting","sudo needs-restarting -r ; echo rc=$?     # 1 = reboot required","sudo needs-restarting -s                  # services needing restart","sudo systemctl restart <unit-from-the-list>"],
     check:"needs-restarting -s prints a list of unit names (or nothing if clean)"},
    {q:"Review the transaction history, inspect what one transaction changed, and roll it back.",
     hint:"history list, history info <id>, then undo. Rollback is not possible when a dependency has since been removed - know that limit.",
     sol:["sudo dnf history list | head","sudo dnf history info last","sudo dnf history undo last -y","sudo dnf history list | head -3","# to repeat a transaction on another host:","sudo dnf history redo <ID>"],
     check:"A new transaction appears in the history describing the reversal"},
    {q:"Install a package from a third-party repository you add yourself, with GPG verification enabled, and prove the signature was checked.",
     hint:"Add the repo with config-manager or a .repo file, import the key explicitly, then query the installed package signature.",
     sol:["sudo dnf install -y \\","  https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm","sudo rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-EPEL-10","sudo dnf repolist | grep -i epel","sudo dnf install -y htop","rpm -qi htop | grep -i signature","rpm -q gpg-pubkey --qf '%{name}-%{version} %{summary}\\n'"],
     check:"rpm -qi shows a Signature line with a key ID, not '(none)'"},
    {q:"Download a package and all its dependencies for an air-gapped host, without installing them.",
     hint:"dnf download --resolve, or the downloadonly plugin with a chosen directory.",
     sol:["sudo dnf install -y dnf-plugins-core","mkdir -p /var/tmp/offline && cd /var/tmp/offline","sudo dnf download --resolve --alldeps httpd","ls -1 /var/tmp/offline | head","# alternative:","sudo dnf install --downloadonly --downloaddir=/var/tmp/offline httpd"],
     check:"The directory contains httpd plus its dependency RPMs"},
    {q:"Verify the integrity of an installed package against the RPM database and interpret the output.",
     hint:"rpm -V prints a character mask per changed file: S size, M mode, 5 checksum, U user, G group, T mtime, c means config file.",
     sol:["sudo rpm -V openssh-server","sudo rpm -Va | head -20","echo '# drill' | sudo tee -a /etc/ssh/sshd_config > /dev/null","sudo rpm -V openssh-server      # now shows S.5....T. c /etc/ssh/sshd_config","sudo sed -i '$ d' /etc/ssh/sshd_config"],
     check:"You can decode the S.5....T. mask in one sentence"}
  ],
  distro:[
    ["RHEL 10","Modularity is deprecated and no modular content ships - dnf module is effectively dead. Filelists metadata is NOT downloaded by default, so file-path queries may need --setopt=optional_metadata_types=filelists. RPM 4.19 verifies signatures through Sequoia PGP."],
    ["RHEL 9","dnf module enable/install still matters (php:8.1, nodejs:18 and so on). Filelists are downloaded by default."],
    ["Fedora 42","Ships DNF 5, where dnf is dnf5: some flags differ (dnf5 repoquery, dnf5 history). RHEL 10 still ships the DNF 4 line - do not assume Fedora syntax works on RHEL."],
    ["Ubuntu 24.04","apt update / apt upgrade / apt full-upgrade; query with apt-cache policy, dpkg -S <path> (equivalent to rpm -qf), dpkg -L <pkg> (rpm -ql), apt-file search for uninstalled files. Security-only patching is unattended-upgrades with the security origin; there is no dnf history undo equivalent - /var/log/apt/history.log plus apt install pkg=version is the manual rollback."]
  ],
  practice:"Patch nights follow the same shape everywhere: snapshot or backup, preview the transaction, apply scoped errata, check needs-restarting, verify the application, record the dnf history ID in the change ticket. The history ID is your rollback handle - write it down before you leave.",
  docs:["Red Hat: Managing software with the DNF tool (RHEL 10)","Red Hat: Considerations in adopting RHEL 10 - Software management (filelists and modularity changes)","man 8 dnf, man 8 rpm, man 8 needs-restarting"]
},
{
  id:"s12", level:"Hard", mins:55, map:"RH124 ch14, RH134 ch11",
  title:"Stand up an internal package mirror for an air-gapped estate",
  role:"Production has no internet. You must serve a curated set of RPMs from one host over HTTP, sign the metadata expectations correctly, point clients at it, and prove a client can install from it with GPG checking on.",
  brief:"This is the repository half of package management that RH124 introduces and every real environment depends on. It also drills file serving, SELinux contexts and firewall rules in a way that mirrors production work.",
  setup:["sudo dnf install -y createrepo_c httpd","sudo systemctl enable --now httpd","sudo install -d /var/www/html/repo/local"],
  tasks:[
    {q:"Populate the repository directory with a handful of packages downloaded from an upstream repo, without installing them.",
     hint:"Reuse the download technique from the patching drill and point it at the web root.",
     sol:["sudo dnf download --resolve --alldeps --destdir=/var/www/html/repo/local httpd tree tmux","ls -1 /var/www/html/repo/local | head","du -sh /var/www/html/repo/local"],
     check:"The directory contains several .rpm files"},
    {q:"Generate the repository metadata, then inspect what was created.",
     hint:"createrepo_c writes a repodata directory containing XML indexes.",
     sol:["sudo createrepo_c /var/www/html/repo/local","ls -l /var/www/html/repo/local/repodata/","sudo createrepo_c --update /var/www/html/repo/local   # after adding packages later"],
